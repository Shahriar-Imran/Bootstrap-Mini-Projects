<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/styles.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <title>Pricing Cards</title>
    </head>
    <body>
        <div class="container">
            <div class="row mt-5">
                <div class="col-md-6">
                    <!-- Card 1 -->
                    <div class="card rounded-4 shadow-lg border-0 mb-5">
                        <div class="card-body">
                            <div>
                                <h4 class="fw-bold">Free</h4>
                                <p class="text-muted">For Freelancer</p>
                            </div>
                            <h2 class="fs-1 fw-bold mt-4 mb-5">$0</h2>

                            <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-2">
                                <li class="list-group-item border-0">
                                    <i class="bi bi-check2"></i> Single User
                                </li>
                                <li class="list-group-item border-0">
                                    <i class="bi bi-check2"></i> 10 Downloads per month
                                </li>
                                <li class="list-group-item border-0">
                                    <i class="bi bi-check2"></i> Faster files
                                </li>
                                <li class="list-group-item border-0">
                                    <i class="bi bi-check2"></i> 25 Custom packs
                                </li>
                            </ul>
                            <div class="d-grid">
                                <button class="btn btn-dark rounded-4 mt-5 mb-4">Subscribe</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- Card 2 -->
                    <div class="card rounded-4 shadow-lg border-0 mb-5 text-bg-dark">
                        <div class="card-body">
                            <div>
                                <h4 class="fw-bold">Pro</h4>
                                <p class="text-white">For Agencies</p>
                            </div>
                            <h2 class="fs-1 fw-bold mt-4 mb-5">$0</h2>

                            <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-2">
                                <li class="list-group-item border-0 text-bg-dark">
                                    <i class="bi bi-check2"></i> Unlimited Users
                                </li>
                                <li class="list-group-item border-0 text-bg-dark">
                                    <i class="bi bi-check2"></i>Unlimited Downloads
                                </li>
                                <li class="list-group-item border-0 text-bg-dark">
                                    <i class="bi bi-check2"></i> Fully Editable Files
                                </li>
                                <li class="list-group-item border-0 text-bg-dark">
                                    <i class="bi bi-check2"></i> 200+ Custom Packs
                                </li>
                            </ul>
                            <div class="d-grid">
                                <button class="btn btn-light rounded-4 mt-5 mb-4">Subscribe</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>



        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
