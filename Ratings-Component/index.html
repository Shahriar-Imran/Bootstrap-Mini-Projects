<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
        crossorigin="anonymous"
        />
        <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/styles.css"/>
        <title>Rating Component</title>
    </head>
    <body>
        <div class="container">
            <div class="card bg-light border-0 shadow-lg rounded-4 mt-5">
                <div class="card-body">
                    <!-- Top Row -->
                    <div class="row p-5">
                        <div class="col-7">
                            <h2 class="fw-bold">What others think about the product</h2>
                        </div>
                        <div class="col-5">
                            <div class="card">
                                <div class="card-body">
                                    <h3 class="display-5 fw-semibold">
                                        <i class="bi bi-star-fill text-warning"></i> 4.8
                                    </h3>
                                    <p class="text-center">Average Rating</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Row-2 -->
                    <div class="row px-5">
                        <div class="col-12">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text rounded-start-5"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control rounded-end-5" name="search" id="search" placeholder="Search Review">
                            </div>
                        </div>
                    </div>
                    <div class="row p-5">
                        <div class="col-12 vstack gap-2">
                            <h5>Reviews</h5>
                            <div class="d-flex align-item-center gap-1">
                                <span>5</span> <i class="bi bi-star-fill text-warning"></i>
                                <div class="progress ms-3" style="height: 10px; width: 100%;">
                                    <div class="progressbar bg-warning" style="width: 80%" role="progressbar" aria-valuenow="80" aria-valuemax="100" aria-valuemin="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-canter gap-1">
                                <span>4</span> <i class="bi bi-star-fill text-warning"></i>
                                <div class="progress ms-3" style="height: 10px; width: 100%;">
                                    <div class="progressbar bg-warning" style="width: 60%" role="progressbar" aria-valuenow="60" aria-valuemax="100" aria-valuemin="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-canter gap-1">
                                <span>3</span> <i class="bi bi-star-fill text-warning"></i>
                                <div class="progress ms-3" style="height: 10px; width: 100%;">
                                    <div class="progressbar bg-warning" style="width: 30%" role="progressbar" aria-valuenow="30" aria-valuemax="100" aria-valuemin="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-canter gap-1">
                                <span>2</span> <i class="bi bi-star-fill text-warning"></i>
                                <div class="progress ms-3" style="height: 10px; width: 100%;">
                                    <div class="progressbar bg-warning" style="width: 20%" role="progressbar" aria-valuenow="20" aria-valuemax="100" aria-valuemin="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-canter gap-1">
                                <span>1</span> <i class="bi bi-star-fill text-warning"></i>
                                <div class="progress ms-3" style="height: 10px; width: 100%;">
                                    <div class="progressbar bg-warning" style="width: 40%" role="progressbar" aria-valuenow="40" aria-valuemax="100" aria-valuemin="0"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row px-5 pb-4">
                        <div class="col-12">
                            <a href="#" class="btn btn-success rounded-5 btn-lg">Write Review</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
